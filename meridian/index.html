<!doctype html>
<meta charset=utf-8>
<title>MERIDIAN — 64k intro</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#o{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfd6dd;font:300 14px/2 Helvetica Neue,Helvetica,Arial,sans-serif;letter-spacing:.5em;text-transform:uppercase;cursor:pointer;text-align:center}
#o b{font-weight:200;font-size:44px;letter-spacing:.6em;margin-right:-.6em;color:#fff}
</style>
<canvas id=c></canvas>
<div id=o><b>Meridian</b><span id=s>click to begin</span></div>
<script>
'use strict';
// ============================================================ SOUNDTRACK
// Everything is synthesised into one stereo buffer before playback.
//SYNTH-BEGIN
function synth(){
const SR=44100,BAR=2.4,N=(48*BAR+5)*SR|0;
const L=new Float32Array(N),R=new Float32Array(N),WL=new Float32Array(N),WR=new Float32Array(N);
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/1073741823.5-1;
const put=(i,l,r,s)=>{if(i<N){L[i]+=l;R[i]+=r;WL[i]+=l*s;WR[i]+=r*s}};
// subtractive voice: nv detuned oscillators -> state variable low-pass -> envelope
function note(t,d,n,o){
  const v=o.v||.1,w=o.w||0,a=o.a||.005,r=o.r||.2,c=o.c||2000,e=o.e||0,ed=o.ed||.2,q=o.q||.6,nv=o.nv||1,det=o.det||0,pan=o.pan||0,send=o.send||0;
  const i0=t*SR|0,len=(d+r)*SR|0,f=440*2**((n-69)/12);
  const gl=v*Math.cos((pan+1)*.7854),gr=v*Math.sin((pan+1)*.7854),ph=[],inc=[];
  for(let k=0;k<nv;k++){ph.push(rnd()*.5+.5);inc.push(f*2**((k-(nv-1)/2)*det/1200)/SR)}
  let lo=0,bp=0;
  for(let i=0;i<len;i++){
    const s=i/SR;let x=0;
    for(let k=0;k<nv;k++){let p=ph[k]+inc[k];p-=p|0;ph[k]=p;x+=w==0?2*p-1:w==1?(p<.5?1:-1):w==2?Math.sin(6.2832*p):4*Math.abs(p-.5)-1}
    x/=nv;
    const g=2*Math.sin(3.1416*Math.min(c+e*Math.exp(-s/ed),9000)/SR);
    lo+=g*bp;bp+=g*(x-lo-q*bp);
    const y=lo*Math.min(1,s/a)*(s<d?1:Math.exp(-(s-d)/r*4));
    put(i0+i,y*gl,y*gr,send);
  }
}
function kick(t,v){const i0=t*SR|0;for(let i=0;i<SR*.5;i++){const s=i/SR,y=Math.sin(6.2832*(44*s+3.6*(1-Math.exp(-s/.03))))*Math.exp(-s/.14)*v;put(i0+i,y,y,.03)}}
function snare(t,v){const i0=t*SR|0;let p=0;for(let i=0;i<SR*.3;i++){const s=i/SR,n=rnd(),y=((n-p)*.5*Math.exp(-s/.07)+Math.sin(1190*s)*Math.exp(-s/.05)*.5)*v;p=n;put(i0+i,y,y,.35)}}
function hat(t,v,dc,pan){const i0=t*SR|0;let p=0;for(let i=0;i<SR*dc*5;i++){const n=rnd(),y=(n-p)*Math.exp(-i/SR/dc)*v;p=n;put(i0+i,y*(1-pan),y*(1+pan),.1)}}
function sweep(t,d,up){const i0=t*SR|0;let lo=0;for(let i=0;i<d*SR;i++){const s=i/SR/d,k=up?s:1-s;lo+=(rnd()-lo)*(.01+.5*k*k);const y=lo*k*k*.22;put(i0+i,y*(1-.5*Math.sin(s*9)),y*(1+.5*Math.sin(s*9)),.6)}}
const bell=(t,n,v,pan)=>{note(t,.05,n,{w:2,v,r:2.4,c:8000,send:.7,pan});note(t,.05,n+12,{w:2,v:v*.3,r:1.2,c:8000,send:.7,pan:-pan});note(t,.05,n+19,{w:2,v:v*.1,r:.6,c:8000,send:.7,pan})};
// harmony: Dm - Bb - F - C, two bars each
const CH=[[38,3],[34,4],[41,4],[36,4]];
const MOT=[[[0,69],[1.5,65],[3,62],[4,64],[6,65]],[[0,70],[1.5,65],[3,62],[5,65],[6,67]],[[0,72],[1.5,69],[3,65],[4,67],[6,69]],[[0,67],[1.5,64],[3,60],[4,64],[6,67],[7,69]]];
const LEAD=[[[0,74,1.5],[1.5,77,1.5],[3,81,2],[5,79,.5],[5.5,77,.5],[6,76,2]],[[0,77,1.5],[1.5,74,1.5],[3,82,2.5],[6,81,1],[7,79,1]],[[0,81,3],[3,84,1.5],[4.5,81,1.5],[6,79,2]],[[0,79,1.5],[1.5,76,1.5],[3,84,2],[5,82,1],[6,79,2]]];
for(let b=0;b<48;b++){
  const sec=b>>3,t=b*BAR,ci=b>>1&3,root=CH[ci][0],tri=[0,CH[ci][1],7],groove=sec==1||sec==2||sec==4;
  if(!(b&1)){
    tri.forEach((iv,k)=>note(t,2*BAR,root+24+iv,{v:.05,nv:3,det:18,a:b?1:4,r:1.8,c:[450,650,850,1000,1500,500][sec],q:.9,pan:(k-1)*.7,send:.6}));
    if(!groove)note(t,2*BAR,root,{w:2,v:.22,a:.5,r:1,c:8000,send:.05});
    if(sec>2)tri.forEach((iv,k)=>note(t,2*BAR,root+48+iv,{w:3,v:.028,nv:2,det:9,a:1.5,r:2,c:2500,pan:(1-k)*.8,send:.8}));
    if(sec==0&&b>1||sec==3||sec==5)MOT[ci].forEach((m,k)=>bell(t+m[0]*.6,m[1]+(sec==3?12:0),.07,k%2-.5));
    if(sec==2||sec==4)LEAD[ci].forEach(m=>note(t+m[0]*.6,m[2]*.6,m[1]+(sec==4&&b%4>1?12:0),{nv:2,det:12,v:.05,a:.03,r:.4,c:900,e:2600,ed:.5,q:.5,send:.55,pan:.15}));
  }
  if(groove)for(let s=0;s<16;s++){
    const ts=t+s*.15,fill=(b&7)==7&&s>11;
    if(sec==4?s%4==0:s==0||s==6||s==10)kick(ts,.85);
    if(sec==4?s%8==4:s==8)snare(ts,.5);
    if(fill)snare(ts,.2+.07*(s-11));
    if(sec>1||s%2==0)hat(ts,s%4==2?.11:.05,s==14?.06:.018,s%2?.3:-.3);
    if(s%2==0)note(ts,.2,root+(s%8==6?12:0),{v:.2,c:140,e:1100,ed:.11,q:.5,r:.08});
    if(sec>1||b%8>3)note(ts,.1,root+36+[0,7,12,tri[1]+12,7,12,tri[1]+12,19][s%8]+(sec==4&&s>7?12:0),{w:1,v:.03,c:700+sec*150,e:2200,ed:.09,q:.4,r:.2,pan:s%2?.6:-.6,send:.4});
  }
  if(sec==3&&b%2)for(let s=0;s<8;s++)note(t+s*.3,.2,root+48+[0,7,tri[1]+12,7][s%4],{w:3,v:.035,c:3000,r:.5,pan:s%2?.5:-.5,send:.7});
  if((b==7||b==31)){sweep(t,BAR,1)}
  if(b==8||b==16||b==32||b==40){kick(t,1);sweep(t,2.2,0);note(t,1.5,26,{w:2,v:.3,r:2,c:8000,send:.2})}
}
// ping-pong delay into the reverb send
const D=.45*SR|0;for(let i=D;i<N;i++){WL[i]+=WR[i-D]*.38;WR[i]+=WL[i-D]*.38}
// Schroeder reverb
function verb(x,off){
  const out=new Float32Array(N),cb=[1557,1617,1491,1422,1277,1356].map(n=>({b:new Float32Array(n+off),i:0,l:0})),ap=[225,556,441].map(n=>({b:new Float32Array(n+off),i:0}));
  for(let i=0;i<N;i++){
    let s=0;const xi=x[i];
    for(const c of cb){const y=c.b[c.i];c.l=y*.72+c.l*.28;c.b[c.i]=xi+c.l*.87;if(++c.i==c.b.length)c.i=0;s+=y}
    for(const a of ap){const y=a.b[a.i];a.b[a.i]=s+y*.5;if(++a.i==a.b.length)a.i=0;s=y-s*.5}
    out[i]=s*.11;
  }
  return out;
}
const VL=verb(WL,0),VR=verb(WR,23),E=115.2*SR;
for(let i=0;i<N;i++){
  const f=Math.min(1,i/SR/2)*(i>E-6*SR?Math.max(0,1-(i-E+6*SR)/(8*SR)):1);
  L[i]=Math.tanh((L[i]+VL[i])*1.25)*f;R[i]=Math.tanh((R[i]+VR[i])*1.25)*f;
}
return[L,R];
}
//SYNTH-END

// ============================================================ SHADERS
const VS=`#version 300 es
void main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}`;
const COMMON=`#version 300 es
precision highp float;
uniform vec2 R;uniform float T,G,K,Q,SH;out vec4 O;
#define sat(x) clamp(x,0.,1.)
const float PI=3.14159265;
vec3 SD,HZ,ZN,SC;
float h11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float h31(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+1.),f.x),f.y);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+1.),f.x),f.y),f.z);}
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n2(p);p=M2*p;a*=.5;}return s;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
vec3 cam(vec2 uv,vec3 ro,vec3 ta,float z,float roll){vec3 f=normalize(ta-ro),r=normalize(cross(vec3(sin(roll),cos(roll),0),f)),u=cross(f,r);return normalize(uv.x*r+uv.y*u+z*f);}
float box(vec3 ro,vec3 rd,vec3 c,vec3 b,out vec3 n){vec3 m=1./mix(rd,vec3(1e-5),lessThan(abs(rd),vec3(1e-5))),k=abs(m)*b,q=m*(ro-c),a=-q-k,e=-q+k;float tn=max(max(a.x,a.y),a.z),tf=min(min(e.x,e.y),e.z);n=vec3(0);if(tn>tf||tf<0.)return 1e9;n=-sign(rd)*step(a.yzx,a.xyz)*step(a.zxy,a.xyz);return tn;}
float stars(vec3 rd){vec3 q=rd*170.;vec3 f=fract(q)-.5;float h=h31(floor(q));return step(.994,h)*(1.-smoothstep(.0,.45,length(f)))*(.5+3.*fract(h*77.));}
vec3 sky(vec3 rd){float y=max(rd.y,0.),s=max(dot(rd,SD),0.);
vec3 c=mix(HZ,ZN,pow(y,.42));
c+=SC*(pow(s,5.)*.12+pow(s,40.)*.3+pow(s,900.)*40.);
if(rd.y>.01){vec2 p=rd.xz/(rd.y+.1)*1.3+G*vec2(.012,.004);float d=smoothstep(.42,.85,fbm(p))*smoothstep(.01,.16,rd.y);
c=mix(c,mix(HZ*.8+SC*pow(s,3.),ZN*.5,.45),d*.75);}
return c;}
vec3 scene(vec2 uv);
void main(){vec2 uv=(gl_FragCoord.xy*2.-R)/R.y;vec3 c=scene(uv);if(any(isnan(c))||any(isinf(c)))c=vec3(0);O=vec4(clamp(c,0.,60.),1);}
`;

// ---- 1 / 6 : open sea, monoliths on the horizon (Q=1: night)
const SEA=`
float seaH(vec2 p){float t=G*.5;return fbm(p*.22+vec2(t*.25,t*.18))+fbm(p*.8-vec2(t*.35,0.))*.3;}
vec3 bgd(vec3 rd){return sky(rd)+stars(rd)*Q*smoothstep(0.,.25,rd.y);}
vec3 mono(vec3 ro,vec3 rd,vec3 bg){
float tm=1e9;vec3 n,nn,cc,bb;
for(int i=0;i<8;i++){float f=float(i),hx=h11(f+.3)-.5;
vec3 b=vec3(5.+h11(f+9.)*7.,45.+h11(f+5.)*120.,5.+h11(f+2.)*6.),c=vec3(hx*300.+sign(hx)*26.,b.y-2.,230.+h11(f*7.1)*300.);
float t=box(ro,rd,c,b,nn);if(t>0.&&t<tm){tm=t;n=nn;cc=c;bb=b;}}
if(tm>1e8)return bg;
vec3 p=ro+rd*tm;float u=abs(n.x)>.5?p.z-cc.z:p.x-cc.x,v=(p.y-cc.y)/bb.y;
vec3 c=vec3(.006,.007,.009)+.1*HZ*pow(1.-abs(dot(n,rd)),3.);
float seam=(1.-smoothstep(.1,.7,abs(u)))*smoothstep(-.75,-.6,v)*(1.-smoothstep(.8,.92,v));
c+=mix(vec3(1.,.38,.08),vec3(.2,.75,1.),Q)*seam*(14.+8.*sin(G*1.3+cc.x));
vec3 hz=sky(normalize(vec3(rd.x,.002,rd.z)));
return mix(c,hz*.55,1.-exp(-tm*.0017));}
vec3 scene(vec2 uv){
SD=normalize(mix(vec3(.12,.055,1.),vec3(-.3,.3,1.),Q));
HZ=mix(vec3(.62,.2,.06),vec3(.035,.07,.13),Q);ZN=mix(vec3(.025,.06,.16),vec3(.003,.007,.02),Q);SC=mix(vec3(1.,.5,.2),vec3(.45,.55,.7),Q);
vec3 ro=vec3(0.,1.6+.2*sin(T*.7),T*3.),rd=cam(uv,ro,ro+vec3(.12*sin(T*.21),.2+.03*sin(T*.4),1.),1.7,.025*sin(T*.3));
if(rd.y>0.)return mono(ro,rd,bgd(rd));
float t=-ro.y/rd.y;vec3 p=ro+rd*t;float e=.04+t*.006,a=.9/(1.+t*.012),h=seaH(p.xz);
vec3 n=normalize(vec3((h-seaH(p.xz+vec2(e,0)))*a,e,(h-seaH(p.xz+vec2(0,e)))*a));
vec3 r=reflect(rd,n);r.y=abs(r.y)+.002;r=normalize(r);
float fr=.04+.96*pow(1.-max(dot(-rd,n),0.),5.);
vec3 c=mix(vec3(.004,.016,.022)+HZ*.012,mono(p,r,bgd(r)),fr);
return mix(c,sky(normalize(vec3(rd.x,.002,rd.z))),1.-exp(-t*.002));}
`;

// ---- 2 / 6 : night city, exact grid traversal + wet-street reflection
const CITY=`
const float C=4.;
bool av(float x,float m){return abs(mod(x+.5,m)-.5)<.25;}
float bh(vec2 id){if(av(id.x,5.)||av(id.y,7.))return 0.;float h=h21(id);return 1.5+h*h*9.+step(.9,h21(id+3.7))*(8.+h*14.);}
float trace(vec3 ro,vec3 rd,out vec3 n,out vec2 id,out vec3 bc,out vec3 bb){
n=vec3(0,1,0);id=vec2(0);bc=vec3(0);bb=vec3(1);
vec2 d=vec2(abs(rd.x)<1e-5?1e-5:rd.x,abs(rd.z)<1e-5?1e-5:rd.z),cell=floor(ro.xz/C),st=sign(d),tm=((cell+max(st,0.))*C-ro.xz)/d,td=C/abs(d);
for(int i=0;i<90;i++){
float h=bh(cell),te=min(tm.x,tm.y);
if(h>0.){float w=C*(.3+.12*h21(cell+1.3));vec3 c=vec3((cell.x+.5)*C,h*.5,(cell.y+.5)*C),b=vec3(w,h*.5,w),na=vec3(0),nb=vec3(0);
float t1=box(ro,rd,c,b,na),t2=1e9;vec3 c2=c,b2=b;
if(h>9.){c2.y=h*1.15;b2=vec3(w*.55,h*.15,w*.55);t2=box(ro,rd,c2,b2,nb);}
if(t1<0.)t1=1e9;if(t2<0.)t2=1e9;
if(min(t1,t2)<1e8){id=cell;if(t1<t2){n=na;bc=c;bb=b;return t1;}n=nb;bc=c2;bb=b2;return t2;}}
float y=ro.y+rd.y*te;if(y<0.||(y>46.&&rd.y>0.)||te>300.)break;
if(tm.x<tm.y){tm.x+=td.x;cell.x+=st.x;}else{tm.y+=td.y;cell.y+=st.y;}}
return -1.;}
vec3 csky(vec3 rd){float y=max(rd.y,0.);vec3 c=mix(vec3(.13,.055,.1),vec3(.004,.008,.025),pow(y,.3));
c+=vec3(.5,.16,.06)*exp(-y*16.)*.5;c+=stars(rd)*smoothstep(.05,.3,y);
float m=max(dot(rd,normalize(vec3(.35,.3,1.))),0.);c+=vec3(.8,.85,1.)*(smoothstep(.9992,.9995,m)*3.+pow(m,300.)*.25);
return c;}
vec3 bshade(vec3 p,vec3 n,vec2 id,vec3 bc,vec3 bb,float t){
float hs=h21(id+9.1);vec3 col=vec3(.01,.012,.018);
if(n.y>.5){vec2 q=p.xz-bc.xz;col+=vec3(.012)+vec3(9.,.4,.2)*(1.-smoothstep(.0,.16,length(q)))*step(.5,fract(G*.7+hs))*step(8.,bc.y);}
else{float u=abs(n.x)>.5?p.z-bc.z:p.x-bc.x,v=p.y;vec2 g=vec2(u/.34,v/.44),wi=floor(g),wf=fract(g);
float lit=step(.5+.25*hs,h31(vec3(wi,hs*91.)));
float m=smoothstep(.1,.2,wf.x)*(1.-smoothstep(.8,.9,wf.x))*smoothstep(.22,.32,wf.y)*(1.-smoothstep(.75,.85,wf.y));
vec3 wc=mix(vec3(1.,.6,.26),vec3(.5,.72,1.),step(.62,h21(id+2.2)))*(.5+h31(vec3(wi,3.)+hs));
float lod=smoothstep(50.,150.,t);
col+=wc*mix(lit*m*2.4,.25,lod)+(1.-lit)*m*.02*vec3(.3,.4,.6)*(1.-lod);
float top=bc.y+bb.y;col+=(1.-smoothstep(.03,.09,abs(v-top+.3)))*step(.66,hs)*mix(vec3(.1,.85,1.),vec3(1.,.12,.55),step(.84,hs))*7.;}
return col;}
vec3 ground(vec3 p){vec3 c=vec3(.008,.009,.012);vec2 ci=floor(p.xz/C),f=fract(p.xz/C);
for(int k=0;k<2;k++){bool on=k==0?av(ci.x,5.):av(ci.y,7.);if(!on)continue;
float lx=k==0?f.x:f.y,z=k==0?p.z:p.x,a=k==0?ci.x:ci.y+40.;
for(int j=0;j<2;j++){float dir=j==0?1.:-1.,s=z*.22-dir*G*(1.6+h11(a+float(j)));
float car=step(.55,h11(floor(s)+a*13.))*(1.-smoothstep(.1,.5,abs(fract(s)-.5)*2.));
c+=(j==0?vec3(3.5,.14,.06):vec3(2.6,2.4,1.9))*car*(1.-smoothstep(.0,.07,abs(lx-(j==0?.32:.68))));}
c+=vec3(.25,.2,.12)*(1.-smoothstep(.0,.02,abs(lx-.5)))*step(.5,fract(z*.5));}
return c;}
vec3 fog(vec3 c,vec3 rd,float t){return mix(c,csky(normalize(vec3(rd.x,.03,rd.z))),1.-exp(-t*.0095));}
vec3 scene(vec2 uv){
vec3 ro,ta;float fl=1.3,rl;
if(SH<.5){ro=vec3(2.,2.4+1.4*sin(T*.31),T*7.);ta=ro+vec3(.22*sin(T*.27),.16+.1*sin(T*.4),1.);rl=.06*sin(T*.35);}
else{ro=vec3(2.+sin(T*.1)*26.,27.,T*5.);ta=ro+vec3(.45*sin(T*.09+1.),-.5,1.);rl=.12*sin(T*.13);fl=1.1;}
vec3 rd=cam(uv,ro,ta,fl,rl),n,bc,bb;vec2 id;
float t=trace(ro,rd,n,id,bc,bb);
if(t>0.)return fog(bshade(ro+rd*t,n,id,bc,bb,t),rd,t);
if(rd.y>=0.)return csky(rd);
t=-ro.y/rd.y;vec3 p=ro+rd*t,c=ground(p);
vec3 r=reflect(rd,normalize(vec3((n2(p.xz*3.)-.5)*.08,1.,(n2(p.xz*3.+9.)-.5)*.08)));r.y=abs(r.y);
float fr=.06+.7*pow(1.-max(-rd.y,0.),4.),t2=trace(p+vec3(0,.01,0),r,n,id,bc,bb);
c+=fr*(t2>0.?fog(bshade(p+r*t2,n,id,bc,bb,t2),r,t2):csky(r));
return fog(c,rd,t);}
`;

// ---- 3 / 6 : valley at dawn, the ring
const LAND=`
const vec3 RC=vec3(-.2,9.,112.);
float th(vec2 p,int oc){float v=smoothstep(3.,30.,abs(p.x+sin(p.y*.03)*8.));p*=.045;float a=1.,s=0.;
for(int i=0;i<7;i++){if(i>=oc)break;float n=n2(p);n=1.-abs(2.*n-1.);s+=a*n*n;p=M2*p;a*=.47;}
return s*11.*(.1+.9*v)-3.;}
float rg(vec3 p){p-=RC;return length(vec2(length(p.xy)-13.,p.z))-.75;}
vec3 tcol(vec3 p,float t,int oc){
float e=.02+t*.004,h=th(p.xz,oc);
vec3 n=normalize(vec3(h-th(p.xz+vec2(e,0),oc),e,h-th(p.xz+vec2(0,e),oc)));
float sh=1.,s=.4;for(int i=0;i<16;i++){vec3 x=p+SD*s;float d=x.y-th(x.xz,5);sh=min(sh,8.*d/s);if(sh<.01)break;s+=max(d,.35);}
float dif=sat(dot(n,SD))*sat(sh),k=n2(p.xz*.6);
vec3 al=mix(vec3(.085,.07,.06),vec3(.17,.13,.1),k);
al=mix(al,vec3(.04,.065,.025),(1.-smoothstep(-1.3,.2,p.y+k))*smoothstep(.7,.92,n.y));
al=mix(al,vec3(.7,.76,.82),smoothstep(.75,.95,n.y+(p.y-6.)*.06+.2*k));
return al*(dif*SC*3.4+(.5+.5*n.y)*ZN*.9+sat(-dot(n,SD))*HZ*.12);}
vec3 fog(vec3 c,vec3 rd,float t){float s=max(dot(rd,SD),0.);return mix(c,HZ*.6+SC*pow(s,6.)*.5,1.-exp(-t*.0055));}
float march(vec3 ro,vec3 rd,int n,int oc){float t=.3;for(int i=0;i<120;i++){if(i>=n)break;vec3 p=ro+rd*t;float d=p.y-th(p.xz,oc);if(d<.0015*t)return t;t+=d*.42;if(t>260.)break;}return -1.;}
vec3 scene(vec2 uv){
SD=normalize(vec3(-.42,.2,.9));HZ=vec3(.7,.36,.2);ZN=vec3(.06,.15,.38);SC=vec3(1.,.7,.42);
float z=T*5.;vec3 ro=vec3(-sin(z*.03)*8.,0.,z);ro.y=max(th(ro.xz,3),-1.6)+2.2+.4*sin(T*.5);
vec3 ta=vec3(-sin((z+14.)*.03)*8.,ro.y+.6+T*.09,z+14.),rd=cam(uv,ro,ta,1.35,.05*sin(T*.3));
float t=march(ro,rd,120,6),tw=rd.y<0.?(-1.6-ro.y)/rd.y:1e9,tmax=t>0.?t:1e9;vec3 c;
if(tw<tmax){tmax=tw;vec3 p=ro+rd*tw;float e=.05;float h=fbm(p.xz*1.5+G*.2);
vec3 n=normalize(vec3((h-fbm(p.xz*1.5+G*.2+vec2(e,0)))*.25,e,(h-fbm(p.xz*1.5+G*.2+vec2(0,e)))*.25)),r=reflect(rd,n);r.y=abs(r.y);
float t2=march(p,r,36,4);vec3 rc=t2>0.?fog(tcol(p+r*t2,t2,4),r,t2):sky(r);
c=mix(vec3(.01,.025,.03),rc,.05+.95*pow(1.-max(dot(-rd,n),0.),5.));c=fog(c,rd,tw);}
else if(t>0.)c=fog(tcol(ro+rd*t,t,7),rd,t);
else c=sky(rd);
float tr=0.,g=0.,d;bool hit=false;
for(int i=0;i<70;i++){d=rg(ro+rd*tr);g+=exp(-max(d,0.)*1.2);if(d<.01){hit=true;break;}tr+=d;if(tr>tmax)break;}
if(hit){vec3 p=ro+rd*tr,q=p-RC;vec2 e=vec2(.01,0);vec3 n=normalize(rg(p)-vec3(rg(p-e.xyy),rg(p-e.yxy),rg(p-e.yyx)));
float an=atan(q.y,q.x),w=length(q.xy)-13.;
vec3 m=vec3(.012)+sky(reflect(rd,n))*.25*(.1+pow(1.-max(dot(-rd,n),0.),3.))+SC*pow(max(dot(reflect(rd,n),SD),0.),40.)*2.;
m+=vec3(.35,.85,1.)*(1.-smoothstep(.05,.16,abs(w)))*step(.12,fract(an*20./PI+G*.05))*(7.+9.*K);
c=fog(m,rd,tr);}
return c+vec3(.2,.55,.8)*g*.012*(1.+K);}
`;

// ---- 4 / 6 : inside the lattice
const VOID=`
float map(vec3 p){p/=3.;float d=-1e5,s=1.;
for(int m=0;m<4;m++){vec3 a=mod(p*s,2.)-1.;s*=3.;vec3 r=abs(1.-3.*abs(a));
d=max(d,(min(max(r.x,r.y),min(max(r.y,r.z),max(r.z,r.x)))-1.)/s);}
return d*3.;}
vec3 scene(vec2 uv){
float z=T*1.5+3.;vec3 ro,ta;
if(SH<.5){ro=vec3(.25*sin(T*.4),.2*sin(T*.33),z);ta=ro+vec3(.35*sin(T*.3),.25*sin(T*.23),1.);}
else{ro=vec3(z-20.,6.+.2*sin(T*.4),.2*sin(T*.3));ta=ro+vec3(1.,.3*sin(T*.3),.35*sin(T*.21));}
vec3 fw=normalize(ta-ro),rd=cam(uv,ro,ta,1.,T*.09),lp=ro+fw*(7.+3.*sin(T*.45));
float t=.02,d;for(int i=0;i<110;i++){d=map(ro+rd*t);if(d<.0008*t||t>60.)break;t+=d;}
vec3 c=vec3(0);
if(t<60.){vec3 p=ro+rd*t;vec2 e=vec2(.002+t*.0008,0);
vec3 n=normalize(map(p)-vec3(map(p-e.xyy),map(p-e.yxy),map(p-e.yyx)));
float ao=1.,s=.06;for(int i=0;i<5;i++){ao-=(s-map(p+n*s))*.9/(1.+float(i));s*=1.9;}ao=sat(ao);
vec3 l=lp-p;float ld=length(l);l/=ld;
float sh=1.,q=.05;for(int i=0;i<20;i++){float m=map(p+l*q);sh=min(sh,10.*m/q);q+=max(m,.03);if(sh<.02||q>ld)break;}
vec3 al=vec3(.5,.46,.42)*(.6+.4*n3(p*9.));
c=al*(max(dot(n,l),0.)*sat(sh)*vec3(1.,.5,.18)*7./(1.+ld*ld*.07)+ao*vec3(.02,.04,.07)+ao*max(dot(n,-rd),0.)*vec3(.05,.07,.1)/(1.+t*t*.02));
vec3 g=abs(fract(p*1.5+.25)-.5)+abs(n)*.5;float ln=(1.-smoothstep(.0,.04,min(g.x,min(g.y,g.z))));
float on=step(.72,h31(floor(p*1.5+n*.3)));
float w=.5+.5*sin((SH<.5?p.z:p.x)*.6-G*3.1416/1.2);
c+=vec3(.08,.75,1.)*ln*on*(1.+9.*w*w*w)*ao;}
c=mix(c,vec3(.006,.012,.025),1.-exp(-t*.055));
vec3 oc=lp-ro;float tc=dot(oc,rd);if(tc>0.&&tc<t){float dd=length(oc-rd*tc);c+=vec3(1.,.55,.2)*(.03/(dd*dd+.003));}
return c;}
`;

// ---- 5 / 6 : the core
const CORE=`
float ring(vec3 p,float r,float w,float h){vec2 d=abs(vec2(length(p.xz)-r,p.y))-vec2(w,h);return length(max(d,0.))+min(max(d.x,d.y),0.)-.012;}
vec3 r1(vec3 p){p.xy*=rot(T*.31);p.yz*=rot(.5+T*.17);return p;}
vec3 r2(vec3 p){p.yz*=rot(1.-T*.23);p.xy*=rot(1.2+T*.11);return p;}
vec3 r3(vec3 p){p.xy*=rot(.25*sin(T*.2));p.yz*=rot(.12);return p;}
vec3 dm(vec3 p){return vec3(ring(r1(p),2.1,.05,.24),ring(r2(p),2.8,.06,.3),ring(r3(p),4.1,.62,.035));}
float map(vec3 p){vec3 d=dm(p);return min(d.x,min(d.y,d.z));}
vec3 scene(vec2 uv){
float a=T*.11+SH*2.4;vec3 ro=SH<.5?vec3(sin(a)*(9.5-T*.12),2.2+sin(T*.2),cos(a)*(9.5-T*.12)):vec3(sin(a)*5.2,.55+.3*sin(T*.3),cos(a)*5.2);
vec3 rd=cam(uv,ro,vec3(0,SH*.4,0),SH<.5?1.6:1.15,.2*sin(T*.1+SH));
vec3 c=vec3(stars(rd))+vec3(.05,.02,.08)*fbm(rd.xy*3.+rd.z)*.5;
float b=dot(ro,rd),ds=b*b-dot(ro,ro)+1.,ts=ds>0.?-b-sqrt(ds):1e9;
float t=0.,d;bool hit=false;for(int i=0;i<110;i++){d=map(ro+rd*t);if(d<.002){hit=true;break;}t+=d*.9;if(t>24.)break;}
float tc=max(-b,0.),dc=length(ro+rd*tc),pu=1.+.5*K;
if(hit&&t<ts){vec3 p=ro+rd*t;vec2 e=vec2(.003,0);vec3 n=normalize(map(p)-vec3(map(p-e.xyy),map(p-e.yxy),map(p-e.yyx))),l=normalize(-p),dd=dm(p);
float I=9./dot(p,p)*pu,sp=pow(max(dot(reflect(rd,n),l),0.),24.);
c=vec3(.22,.2,.18)*(max(dot(n,l),0.)*I*vec3(1.,.55,.22)+.01)+sp*I*vec3(1.,.7,.4)*.5;
vec3 q=dd.x<dd.y?(dd.x<dd.z?r1(p):r3(p)):(dd.y<dd.z?r2(p):r3(p));float an=atan(q.z,q.x),rr=length(q.xz);
if(dd.z<min(dd.x,dd.y))c+=vec3(.1,.8,1.)*(1.-smoothstep(.0,.07,abs(fract(rr*5.)-.5)))*step(.3,fract(an*9./PI-G*.08+floor(rr*5.)*.37))*5.*pu;
else c+=vec3(1.,.3,.06)*(1.-smoothstep(.02,.05,abs(q.y)))*step(.4,fract(an*14./PI+G*.15))*step(0.,rr-(dd.x<dd.y?2.1:2.8))*6.*pu;}
else if(ts<1e8){vec3 p=ro+rd*ts;float f=n3(p*3.+T*.25)*.6+n3(p*7.-T*.4)*.3+n3(p*16.+T)*.1;
c=mix(vec3(1.,.2,.02),vec3(1.,.8,.5),smoothstep(.3,.75,f))*(1.+5.*f*f)*pow(max(dot(p,-rd),0.),.35)*pu;}
if(!(hit&&t<tc)){float x=max(dc-1.,0.),ry=.55+.45*n3(normalize(ro+rd*tc)*5.+T*.15);
c+=vec3(1.,.45,.15)*(ts<1e8?.25:(.5/(1.+x*x*5.)*ry+.06/(.03+x)))*pu;}
return c;}
`;

// ---- post
const BLUR=`#version 300 es
precision highp float;uniform sampler2D S;uniform vec2 R,D;uniform float H;out vec4 O;
void main(){vec2 uv=gl_FragCoord.xy/R;vec3 c=(texture(S,uv+D).rgb+texture(S,uv-D).rgb+texture(S,uv+vec2(D.x,-D.y)).rgb+texture(S,uv-vec2(D.x,-D.y)).rgb)*.25;
if(H>0.){c=min(c,vec3(30.));c*=smoothstep(.75,1.9,max(c.r,max(c.g,c.b)));}
O=vec4(c,1);}`;
const POST=`#version 300 es
precision highp float;uniform sampler2D S,B,X;uniform vec2 R;uniform vec4 P;out vec4 O;
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec3 aces(vec3 x){return clamp(x*(2.51*x+.03)/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
float bh=min(R.y,R.x/2.39);vec2 uv=(gl_FragCoord.xy-R*.5)/vec2(bh*2.39,bh)+.5;
if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.){O=vec4(0,0,0,1);return;}
vec2 d=uv-.5;float r=dot(d,d);
vec3 c=vec3(texture(S,uv+d*r*.02).r,texture(S,uv).g,texture(S,uv-d*r*.02).b);
c+=texture(B,uv).rgb*.15;
c=aces(c*P.x*1.15);c=pow(c,vec3(.4545));
c=mix(c,c*c*(3.-2.*c),.35);
c*=1.-r*1.1;
c+=(h21(gl_FragCoord.xy+fract(P.z)*311.)-.5)*.03;
vec2 tu=(uv-vec2(.5,P.w))/vec2(.84,.84*2.39/8.)+.5;
if(tu.x>0.&&tu.x<1.&&tu.y>0.&&tu.y<1.)c=mix(c,vec3(.95,.97,1.),texture(X,vec2(tu.x,1.-tu.y)).a*P.y);
O=vec4(c,1);}`;

// ============================================================ ENGINE
const cv=document.getElementById('c'),ov=document.getElementById('o'),st=document.getElementById('s');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
const still=location.search.includes('still'),seek=+location.hash.slice(1)||0;
const LEN=115.2,SEC=19.2;
const CAP=[[3,10,'MERIDIAN',150,.5],[11.5,17,'A 64K INTRO',52,.2],[22,27,'NO ASSETS',52,.16],[41,46,'NO LIBRARIES',52,.16],[60,65,'ONLY ARITHMETIC',52,.16],[98,104,'EVERYTHING YOU SAW AND HEARD',46,.5],[105,111,'WAS COMPUTED AS YOU WATCHED',46,.5]];
let progs,post,blur,W,H,FB,BL=[],ac,t0,cap=-1,tx,scale=1,lastT=0,slow=0;
const say=m=>st.textContent=m,tick=()=>new Promise(r=>setTimeout(r,30));
function prog(fs){
  const p=gl.createProgram();
  for(const[t,s]of[[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){const h=gl.createShader(t);gl.shaderSource(h,s);gl.compileShader(h);
    if(!gl.getShaderParameter(h,gl.COMPILE_STATUS)){const e=gl.getShaderInfoLog(h);console.log('SHADER ERROR',e);throw e}gl.attachShader(p,h)}
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);
  p.u={};return p;
}
const U=(p,n)=>n in p.u?p.u[n]:p.u[n]=gl.getUniformLocation(p,n);
function target(w,h,hdr){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,hdr?gl.RGBA16F:gl.RGBA8,w,h,0,gl.RGBA,hdr?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);
  for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  return{t,f,w,h};
}
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr|0;cv.height=innerHeight*dpr|0;
  const q=+(new URLSearchParams(location.search).get('q'))||720;
  H=Math.max(64,Math.min(q,cv.height,cv.width/2.39)*scale|0);W=H*2.39|0;
  const hdr=!!gl.getExtension('EXT_color_buffer_float');
  for(const o of[FB,...BL])if(o){gl.deleteTexture(o.t);gl.deleteFramebuffer(o.f)}
  FB=target(W,H,hdr);BL=[];for(let i=1;i<7&&H>>i>3;i++)BL.push(target(W>>i,H>>i,hdr));
}
function caption(i){
  const c=document.createElement('canvas');c.width=2048;c.height=256;const x=c.getContext('2d');
  if(i>=0){const[, ,s,px]=CAP[i];x.font=`200 ${px}px "Helvetica Neue",Helvetica,Arial,sans-serif`;x.fillStyle='#fff';x.textBaseline='middle';
    const sp=px*.55,ws=[...s].map(ch=>x.measureText(ch).width);let X=1024-(ws.reduce((a,b)=>a+b,0)+sp*(s.length-1))/2;
    [...s].forEach((ch,k)=>{x.fillText(ch,X,128);X+=ws[k]+sp})}
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,tx);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}
const ss=(a,b,x)=>{x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)};
function pass(p,dst,w,h,src){gl.bindFramebuffer(gl.FRAMEBUFFER,dst);gl.viewport(0,0,w,h);gl.useProgram(p);gl.uniform2f(U(p,'R'),w,h);
  if(src){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(U(p,'S'),0)}}
function frame(){
  let g=still?window.__t??seek:ac.currentTime-t0;
  if(g>=LEN+2){ov.style.display='flex';say('click to replay');ov.onclick=()=>location.reload();return}
  requestAnimationFrame(frame);
  // drop internal resolution if the GPU can't keep up
  const now=performance.now(),dt=now-lastT;lastT=now;
  if(!still&&dt<500){slow=dt>36?slow+1:Math.max(0,slow-1);if(slow>12&&H>200){slow=0;scale*=.75;resize()}}
  g=Math.min(g,LEN-.01);
  const si=g/SEC|0,T=g-si*SEC,step=g%2.4/.15;
  let K=0;for(const k of si==4?[0,4,8,12]:si==1||si==2?[0,6,10]:[])if(step>=k)K=Math.exp(-(step-k)*.15*7);
  const fade=ss(0,si?1:3.5,T)*ss(0,si==5?6:1,SEC-T);
  let ci=-1,ca=0;CAP.forEach((c,i)=>{if(g>=c[0]&&g<c[1]){ci=i;ca=ss(0,1.5,g-c[0])*ss(0,1.5,c[1]-g)}});
  if(ci!=cap)caption(cap=ci);
  // scene -> HDR target
  const p=progs[si];pass(p,FB.f,W,H);
  gl.uniform1f(U(p,'T'),T);gl.uniform1f(U(p,'G'),g);gl.uniform1f(U(p,'K'),K);gl.uniform1f(U(p,'Q'),si==5?1:0);gl.uniform1f(U(p,'SH'),T<SEC/2?0:1);
  gl.drawArrays(gl.TRIANGLES,0,3);
  // bloom: threshold + downsample chain, then additive upsample
  let s=FB;
  BL.forEach((b,i)=>{pass(blur,b.f,b.w,b.h,s);gl.uniform2f(U(blur,'D'),.5/s.w,.5/s.h);gl.uniform1f(U(blur,'H'),i?0:1);gl.drawArrays(gl.TRIANGLES,0,3);s=b});
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  for(let i=BL.length-2;i>=0;i--){const b=BL[i],u=BL[i+1];pass(blur,b.f,b.w,b.h,u);gl.uniform2f(U(blur,'D'),.75/u.w,.75/u.h);gl.uniform1f(U(blur,'H'),0);gl.drawArrays(gl.TRIANGLES,0,3)}
  gl.disable(gl.BLEND);
  // grade to screen
  pass(post,null,cv.width,cv.height,FB);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,BL[0].t);gl.uniform1i(U(post,'B'),1);gl.uniform1i(U(post,'X'),2);
  gl.uniform4f(U(post,'P'),fade,ca,g,ci>=0?CAP[ci][4]:.5);
  gl.drawArrays(gl.TRIANGLES,0,3);
  window.__frames=(window.__frames||0)+1;
}
async function start(){
  ov.onclick=null;
  if(!gl){say('this needs WebGL 2');return}
  try{
    if(!still){ac=new AudioContext({sampleRate:44100});say('composing soundtrack');await tick();
      const[l,r]=synth(),buf=ac.createBuffer(2,l.length,44100);buf.copyToChannel(l,0);buf.copyToChannel(r,1);
      var src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination)}
    const srcs=[SEA,CITY,LAND,VOID,CORE];progs=[];
    for(let i=0;i<5;i++){say(`building world ${i+1} / 5`);await tick();progs.push(prog(COMMON+srcs[i]))}
    progs.push(progs[0]);post=prog(POST);blur=prog(BLUR);tx=gl.createTexture();
    resize();addEventListener('resize',resize);
    ov.style.display='none';
    if(!still){await ac.resume();src.start(0,seek);t0=ac.currentTime-seek}
    frame();
  }catch(e){say('error: '+e);console.log('ERR',e)}
}
ov.onclick=start;
addEventListener('keydown',e=>{if(e.key=='f')document.documentElement.requestFullscreen()});
addEventListener('dblclick',()=>document.documentElement.requestFullscreen());
</script>
